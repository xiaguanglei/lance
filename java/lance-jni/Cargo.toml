[package]
name = "lance-jni"
version = "13.0.0"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance"
readme = "../../README.md"
description = "JNI bindings for Lance Columnar format"

# `java/lance-jni/` is excluded from the top-level workspace (see ../../Cargo.toml) and
# keeps its own Cargo.lock. Declaring an empty workspace here makes this crate an explicit
# workspace root, so cargo resolves it standalone even when the checkout is nested inside
# another cargo project (e.g. a git worktree placed under the main checkout).
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["lance-io-aws", "lance-io-azure", "lance-io-gcp", "hdfs-jni", "qbfs"]
backtrace = ["lance/backtrace", "lance-core/backtrace"]
lance-io-aws = ["lance-io/aws"]
lance-io-azure = ["lance-io/azure"]
lance-io-gcp = ["lance-io/gcp"]
hdfs = ["lance-io/hdfs"]
hdfs-jni = ["lance-io/hdfs-jni"]
qbfs = ["lance-io/qbfs"]

[dependencies]
lance = { path = "../../rust/lance", features = ["substrait", "metrics"] }
lance-datafusion = { path = "../../rust/lance-datafusion" }
lance-encoding = { path = "../../rust/lance-encoding" }
lance-linalg = { path = "../../rust/lance-linalg" }
lance-index = { path = "../../rust/lance-index", features = ["tokenizer-jieba", "tokenizer-lindera"] }
lance-io = { path = "../../rust/lance-io", default-features = false, features = ["metrics"] }
lance-namespace = { path = "../../rust/lance-namespace" }
lance-namespace-impls = { path = "../../rust/lance-namespace-impls", features = ["rest", "rest-adapter", "dir-goosefs"] }
lance-core = { path = "../../rust/lance-core" }
lance-file = { path = "../../rust/lance-file" }
lance-table = { path = "../../rust/lance-table" }
arrow = { version = "58.0.0", features = ["ffi"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
datafusion = { version = "54.0.0", default-features = false }
datafusion-common = "54.0.0"
object_store = { version = "0.14.1" }
tokio = { version = "1.23", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "sync",
] }
async-trait = "0.1"
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
bytes = "1.11"
log = "0.4"
metrics = "0.24"
metrics-util = { version = "0.19", default-features = false, features = ["registry"] }
env_logger = "0.11.7"
uuid = { version = "1.17.0", features = ["v4"] }
prost = "0.14.1"
roaring = "0.11.4"
prost-types = "0.14.1"
chrono = "0.4.41"

[profile.dev]
debug = "line-tables-only"
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.dev.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

[profile.release]
strip = true

[lints.clippy]
disallowed_macros = "deny"

# The JVM/Spark binding retains JNI and QBFS; the Rust gateway stays native-only.
[patch.crates-io]
hdfs-native = { path = "../../thirdparty/hdfs-native" }
object_store_opendal = { path = "../../thirdparty/object_store_opendal-0.60.2" }
opendal-service-hdfs = { path = "../../thirdparty/opendal-service-hdfs-0.59.2" }
opendal-service-hdfs-native = { path = "../../thirdparty/opendal-service-hdfs-native-0.59.2" }
